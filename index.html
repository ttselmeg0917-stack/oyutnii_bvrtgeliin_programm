<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Нэвтрэх — Course Registration</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="login-page">

  <main class="login">
    <section class="login-card">
      <form id="loginForm" class="login-form" novalidate>
        <h1 class="login-form__title">Нэвтрэх</h1>
        <p class="login-form__hint">Сургуулийн бүртгэлдээ нэвтэрнэ үү</p>

        <div id="formMessage" class="form-message" role="alert" hidden></div>

        <div class="field">
          <label for="email" class="visually-hidden">Email</label>
          <div class="input-icon">
            <svg class="input-icon__svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="8" r="4" />
              <path d="M4 21c0-4 3.6-7 8-7s8 3 8 7" />
            </svg>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="Email (se24d001@student.edu.mn)"
              autocomplete="email"
              required
            />
          </div>
          <p class="field__error" id="emailError"></p>
        </div>

        <div class="field">
          <label for="password" class="visually-hidden">Нууц үг</label>
          <div class="input-icon password-wrap">
            <svg class="input-icon__svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="4" y="10" width="16" height="11" rx="2" />
              <path d="M8 10V7a4 4 0 0 1 8 0v3" />
            </svg>
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Нууц үг"
              autocomplete="current-password"
              required
            />
            <button type="button" id="togglePassword" class="password-toggle" aria-label="Нууц үг харуулах">
              Харах
            </button>
          </div>
          <p class="field__error" id="passwordError"></p>
        </div>

        <div class="login-links">
          <a href="#">Нууц үгээ мартсан?</a>
        </div>

        <button type="submit" id="loginBtn" class="btn-primary">
          <span class="btn-primary__text">Нэвтрэх</span>
          <span class="spinner" aria-hidden="true"></span>
        </button>

        <p class="login-foot">Бүртгэлгүй юу? <a href="#">Бүртгүүлэх</a></p>
      </form>
    </section>
  </main>

  <style>
    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
